[project]
name = "prospect"
version = "0.1.0"
description = "B2B prospecting pipeline: LinkedIn → Research → News → Email"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "lxml>=5.0",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "ddgs>=9.0",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.16",
]

[project.scripts]
prospect = "prospect.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
